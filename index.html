<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo PWA</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2"> </head>
<body>
<div class="container">
    <header class="search-box">
        <input type="text" autocomplete="off" class="search-input" placeholder="Entrez une ville..." />
    </header>

    <main class="weather-box">
        <div class="location-details">
            <div class="city">Recherchez une ville</div>
            <div class="date">Jeudi 11 Décembre 2025</div>
        </div>

        <div class="current-weather">
            <div class="temp">--°C</div>
            <div class="weather">...</div>
            <div class="hi-low">H:--°C / B:--°C</div>
        </div>
    </main>

    <footer>
        <p>Application Météo PWA</p>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
