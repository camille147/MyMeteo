<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyMeteo</title>
    <meta name="description" content="Application météo simple et rapide.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f6f9ff" id="meta-theme-color">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="main-wrapper">
    <main class="weather-card">

        <header class="app-header">
            <h1>MyMeteo</h1>
            <button id="theme-toggle"
                    aria-label="Changer le thème"
                    aria-pressed="false">
                <span aria-hidden="true">🌙</span>
            </button>
        </header>

        <!-- Formulaire de recherche -->
        <div class="search">
            <input id="city-input" type="search" placeholder="Entrez une ville (ex: Paris)" aria-label="Ville">
            <button id="search-btn">Rechercher</button>
        </div>

        <!-- États (chargement / erreur) -->
        <div id="loading" class="hidden" role="status" aria-live="polite">
            Chargement…
        </div>

        <div id="error-message"
             class="error hidden"
             role="alert"
             aria-live="assertive">
        </div>

        <!-- Résultats météo -->
        <section id="weather-section" class="hidden results" aria-live="polite">

            <div class="summary">

                <div class="city-row">
                    <div id="city-name" class="city">—</div>
                </div>

                <div class="temp-row">
                    <div id="weather-icon" class="icon" aria-hidden="true">🌤️</div>
                    <div id="temperature" class="temp">—°C</div>
                </div>

                <div class="meta">
                    <div id="wind">—</div>
                    <div id="humidity">—</div>
                    <div id="feels-like">—</div>
                </div>
            </div>

            <div class="hourly">
                <h2>Prochaines heures</h2>
                <div id="hourly-list" class="hourly-list"></div>
            </div>

        </section>
    </main>
</div>

<script src="app.js" defer></script>


</body>
</html>
